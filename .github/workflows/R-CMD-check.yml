name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: 'release'}
          - {os: macos-latest, r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      NOT_CRAN: true
      # Network tests (gnomAD remote tabix) skip automatically if offline.
      # Live LDlink (when Chunk B lands) also gated by env var.

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - name: Install system dependencies (ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Install R packages
        run: |
          Rscript -e 'options(repos = c(CRAN = "https://cloud.r-project.org"))
                      install.packages(c("BiocManager", "testthat", "tibble",
                                         "dplyr", "tidyr", "readr", "stringr",
                                         "cli", "cachem", "memoise", "httr2",
                                         "rlang", "vctrs"))
                      BiocManager::install(c("Rsamtools", "VariantAnnotation",
                                             "GenomicRanges", "GenomeInfoDb",
                                             "rtracklayer", "Biostrings",
                                             "S4Vectors", "IRanges"),
                                           update = FALSE, ask = FALSE)'

      - name: Run testthat
        run: |
          Rscript -e 'testthat::test_dir("tests/testthat", reporter = "summary", stop_on_failure = TRUE)'
