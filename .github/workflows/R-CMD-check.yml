name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: 'release'}
          - {os: macos-latest, r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      NOT_CRAN: true
      # Network tests (gnomAD remote tabix) skip automatically if offline.
      # Set ISOVAR_SKIP_NETWORK_TESTS=1 to force-skip.

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::testthat
            any::tibble
            any::dplyr
            any::tidyr
            any::readr
            any::stringr
            any::cli
            any::cachem
            any::memoise
            any::httr2
            bioc::Rsamtools
            bioc::VariantAnnotation
            bioc::GenomicRanges
            bioc::GenomeInfoDb
            bioc::rtracklayer
            bioc::Biostrings
            bioc::S4Vectors
          needs: check

      - name: Run testthat
        run: |
          Rscript -e 'testthat::test_dir("tests/testthat", reporter = "summary", stop_on_failure = TRUE)'
